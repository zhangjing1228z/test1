<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳格子游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
            max-width: 600px;
            width: 95%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .score, .level {
            font-size: 1.2em;
            color: #555;
        }

        .score span, .level span {
            color: #667eea;
            font-weight: bold;
            font-size: 1.4em;
        }

        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #e8f4f8;
            border-radius: 10px;
            color: #555;
            line-height: 1.6;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 100;
        }

        .game-over h2 {
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .game-over p {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 跳格子游戏</h1>
        
        <div class="game-info">
            <div class="score">得分：<span id="score">0</span></div>
            <div class="level">等级：<span id="level">1</span></div>
        </div>

        <canvas id="gameCanvas" width="500" height="300"></canvas>

        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
            <button onclick="pauseGame()">暂停/继续</button>
        </div>

        <div class="instructions">
            <strong>游戏说明：</strong><br>
            按空格键或点击屏幕让角色跳跃<br>
            避开红色障碍物，跳过越多得分越高<br>
            每得10分等级提升，速度加快
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>游戏结束!</h2>
        <p>最终得分：<span id="finalScore">0</span></p>
        <button onclick="restartGame()">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const gameOverDiv = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        // 游戏状态
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let level = 1;
        let animationId;

        // 玩家角色
        const player = {
            x: 50,
            y: 250,
            width: 30,
            height: 30,
            velocityY: 0,
            jumping: false,
            gravity: 0.6,
            jumpPower: -12,
            color: '#667eea'
        };

        // 障碍物数组
        let obstacles = [];
        let obstacleTimer = 0;
        let obstacleInterval = 100;

        // 地面
        const ground = {
            y: 280,
            height: 20
        };

        // 初始化游戏
        function init() {
            player.y = 250;
            player.velocityY = 0;
            player.jumping = false;
            obstacles = [];
            score = 0;
            level = 1;
            obstacleInterval = 100;
            scoreElement.textContent = score;
            levelElement.textContent = level;
            gameOverDiv.style.display = 'none';
        }

        // 开始游戏
        function startGame() {
            if (!gameRunning) {
                init();
                gameRunning = true;
                gamePaused = false;
                animate();
            }
        }

        // 暂停/继续游戏
        function pauseGame() {
            if (gameRunning) {
                gamePaused = !gamePaused;
                if (!gamePaused) {
                    animate();
                }
            }
        }

        // 重新开始
        function restartGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            startGame();
        }

        // 跳跃
        function jump() {
            if (!player.jumping && gameRunning && !gamePaused) {
                player.velocityY = player.jumpPower;
                player.jumping = true;
            } else if (!gameRunning) {
                startGame();
            }
        }

        // 生成障碍物
        function spawnObstacle() {
            const height = Math.random() * 30 + 20;
            obstacles.push({
                x: canvas.width,
                y: ground.y - height,
                width: 20,
                height: height,
                color: '#e74c3c',
                passed: false
            });
        }

        // 更新游戏状态
        function update() {
            if (gamePaused) return;

            // 应用重力
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // 地面碰撞检测
            if (player.y + player.height > ground.y) {
                player.y = ground.y - player.height;
                player.velocityY = 0;
                player.jumping = false;
            }

            // 生成障碍物
            obstacleTimer++;
            if (obstacleTimer >= obstacleInterval) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            // 更新障碍物
            const speed = 3 + level * 0.5;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= speed;

                // 检查是否通过障碍物
                if (!obstacles[i].passed && obstacles[i].x + obstacles[i].width < player.x) {
                    obstacles[i].passed = true;
                    score++;
                    scoreElement.textContent = score;

                    // 每10分升级
                    if (score % 10 === 0) {
                        level++;
                        levelElement.textContent = level;
                        obstacleInterval = Math.max(50, obstacleInterval - 5);
                    }
                }

                // 移除屏幕外的障碍物
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }

                // 碰撞检测
                if (checkCollision(player, obstacles[i])) {
                    gameOver();
                }
            }
        }

        // 碰撞检测
        function checkCollision(player, obstacle) {
            return player.x < obstacle.x + obstacle.width &&
                   player.x + player.width > obstacle.x &&
                   player.y < obstacle.y + obstacle.height &&
                   player.y + player.height > obstacle.y;
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制天空背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制云朵
            drawClouds();

            // 绘制地面
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, ground.y, canvas.width, ground.height);
            
            // 绘制草地
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, ground.y, canvas.width, 5);

            // 绘制玩家
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 绘制玩家眼睛
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 20, player.y + 5, 8, 8);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 24, player.y + 7, 4, 4);

            // 绘制障碍物
            obstacles.forEach(obstacle => {
                ctx.fillStyle = obstacle.color;
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                
                // 添加障碍物细节
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });

            // 如果游戏暂停，显示暂停文字
            if (gamePaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏暂停', canvas.width / 2, canvas.height / 2);
            }
        }

        // 绘制云朵
        let cloudOffset = 0;
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            cloudOffset -= 0.5;
            if (cloudOffset <= -100) cloudOffset = 0;
            
            // 绘制几朵云
            drawCloud(50 + cloudOffset, 50);
            drawCloud(200 + cloudOffset, 80);
            drawCloud(350 + cloudOffset, 40);
            drawCloud(500 + cloudOffset, 70);
        }

        function drawCloud(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 25, y - 10, 25, 0, Math.PI * 2);
            ctx.arc(x + 50, y, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        // 游戏循环
        function animate() {
            if (!gamePaused) {
                update();
                draw();
                animationId = requestAnimationFrame(animate);
            }
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            finalScoreElement.textContent = score;
            gameOverDiv.style.display = 'block';
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        // 触摸事件（支持移动端）
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        // 鼠标点击事件
        canvas.addEventListener('click', () => {
            jump();
        });

        // 初始绘制
        draw();
    </script>
</body>
</html>
